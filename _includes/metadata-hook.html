<script>
(() => {
  const v = '{{ site.time | date: "%s" }}';
  const css = document.querySelector('link[href*="jekyll-theme-chirpy.css"]');
  if (css && !css.href.includes('?v=')) {
    css.href = `${css.href}?v=${v}`;
  }

  const scripts = [
    'script[src*="/assets/js/dist/theme.min.js"]',
    'script[src*="/assets/js/dist/page.min.js"]'
  ];

  scripts.forEach((selector) => {
    const el = document.querySelector(selector);
    if (el && el.src && !el.src.includes('?v=')) {
      el.src = `${el.src}?v=${v}`;
    }
  });
})();
</script>

<style>
/* Prevent flash of unstyled content until theme CSS is available */
html:not(.css-ready) body {
  visibility: hidden;
}

/* Breadcrumb separator rendered as plain ASCII slash */
#topbar #breadcrumb span:not(:last-child)::after {
  content: "/" !important;
  padding: 0 .3rem !important;
  font-family: inherit !important;
}
#topbar #breadcrumb span + span::before,
#breadcrumb span + span::before {
  content: none !important;
}
</style>

<script>
(() => {
  const root = document.documentElement;
  const ready = () => root.classList.add('css-ready');

  const hasThemeCss = () => {
    for (const sheet of document.styleSheets) {
      const href = sheet && sheet.href ? String(sheet.href) : '';
      if (href.includes('/assets/css/jekyll-theme-chirpy.css')) {
        return true;
      }
    }
    return false;
  };

  const waitForThemeCss = () => {
    if (hasThemeCss()) {
      ready();
      return;
    }
    requestAnimationFrame(waitForThemeCss);
  };

  waitForThemeCss();
  setTimeout(ready, 3000);
})();
</script>

<script>
/* Override theme's pageviews fallback (which shows 1 on error).
   Show only real GoatCounter values; show '-' when unavailable. */
document.addEventListener('DOMContentLoaded', async () => {
  const pv = document.getElementById('pageviews');
  if (!pv) return;

  pv.textContent = '-';

  const pathFromGoat = window.goatcounter && typeof window.goatcounter.get_data === 'function'
    ? window.goatcounter.get_data().p
    : location.pathname.replace(/\/$/, '');

  const site = '{{ site.analytics.goatcounter.id }}';
  const path = String(pathFromGoat || location.pathname.replace(/\/$/, '')).replace(/^https?:\/\/[^/]+/i, '');
  const endpoint = `https://${site}.goatcounter.com/counter/${encodeURIComponent(path)}.json`;

  try {
    const res = await fetch(endpoint, { cache: 'no-store' });
    if (!res.ok) return;

    const data = await res.json();
    const raw = data && (data.count ?? data.total ?? data.visits);
    const count = Number(raw);
    if (!Number.isFinite(count)) return;

    pv.textContent = new Intl.NumberFormat().format(count);
  } catch (_) {
    // Keep '-' on failure.
  }
});
</script>
